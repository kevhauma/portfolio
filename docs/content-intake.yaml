# ─── Projects (02) ────────────────────────────────────────────────────────────

# 2–4 work highlights. Each should match a sector above (same client + project).
work_highlights:
  - client: Aurubis
    project: Scrap yard management
    team_size: 3–5
    contribution: Full-stack work on the yard flow from planning to invoicing for a multilingual client. Introduced new technology at the client. The migration from .NET Framework to .NET 6 was a team effort, not led by Kevin (corrected 2026-10-13): built side by side, then cut over.
    shipped: Yard management for a multi-plant copper scrapyard (delivery planning, weighing, payload inspection, invoicing)
    stack: [React, MUI, Telerik, React Final Form, .NET Framework, .NET 6, MSSQL]
    public_url: ~
    figures: ~

  - client: Aurubis
    project: Driver check-in kiosk
    team_size: 2–3
    contribution: Modelled the guided check-in as an XState state machine, driving the ID scanner, printer and safety videos, while requirements kept shifting.
    shipped: Multilingual self-service check-in for delivery drivers, with a site map guide creator
    stack: [React, MUI, XState, React Hook Form, .NET 6, MSSQL]
    public_url: ~
    figures: ~

  - client: ArCom
    project: DBA tool
    team_size: 1–3
    contribution: Reverse-engineered a legacy C++ DBA application without its source code and rebuilt it as a web app, largely solo, with a tabbed interface, shared page abstractions and complex state.
    shipped: Web-based DBA tool replacing the C++ application
    stack: [React, TypeScript, MUI, TanStack Query, React Hook Form, .NET, MSSQL, Docusaurus]
    public_url: ~
    figures: ~

