# Content intake form. Fill in, leave blank what you don't know yet.
# See content-gathering.md for why each part exists. Later this file is split into the
# Astro content collections; keep the field names as they are.
#
# Conventions
#   month:  "2023-04"        day: "2023-04-17"
#   ~ or empty = unknown / not applicable
#   Copy a list entry (the block starting with "-") to add more.

# ─── Site-wide ────────────────────────────────────────────────────────────────

identity:
  first_name: Kevin
  surname:                     # full name shows in recruiter mode, <title> and meta
  linkedin:                    # full URL
  email:                       # alias on your own domain, once the domain exists
  domain:                      # not bought yet

# Exactly 8 (the intro layout has 8 decal slots), biggest use first.
# use: 0–1, set by you.
stack:
  - { name: TypeScript, use: 1.0 }
  - { name: Node.js, use: 0.9 }
  - { name: React, use: 0.8 }
  - { name: Angular, use: 0.7 }
  - { name: Tailwind, use: 0.6 }
  - { name: TanStack, use: 0.5 }
  - { name: ECharts, use: 0.4 }
  - { name: Three.js, use: 0.3 }

# ─── Experience: the timing screen (03) ──────────────────────────────────────

